<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Pig Game</title>
  </head>
  <body>
    <main class="hidden">
      <section class="player player--0 player--active">
        <h2 class="name" id="name--0">Player 1</h2>
        <p class="score" id="score--0">50</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>
      <section class="player player--1">
        <h2 class="name" id="name--1">Player 2</h2>
        <p class="score" id="score--1">40</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>

      <img src="dice-5.png" alt="Playing dice" class="dice" />
      <button class="btnStyle btn btn--new">🔄 New game</button>
      <div class="boxBtn">
        <button class="btnStyle btn btn--roll">🎲 Roll dice</button>
        <button class="btnStyle btn btn--hold">📥 Hold</button>
      </div>
    </main>

    <div class="overlay hidden">
      <div class="winnerModal">
        <h2 class="name winnerTitle">Player One Win!</h2>
        <button class="playAgainBtn">Play Again</button>
      </div>
    </div>

    <div class="overlay" id="guide-overlay">
      <div class="guideModal">
        <h2 class="name winnerTitle">Player Guide</h2>
        <ol>
          <li>The first player to score 100 points wins the game!</li>
          <li>
            Watch out! If you roll a 1, your current score goes back to zero...
          </li>
          <li>Press Hold to lock in points. First to 100 wins!</li>
        </ol>
        <button class="playNowBtn">Play Now</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
